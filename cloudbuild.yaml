# Builds the website image, stores it in Artifact Registry and deploys it to Cloud Run.
# Runs as the project's "deployer" service account (see sjks-infra), one Google Cloud project per environment.
# The defaults are for STAGING; the production trigger overrides them:
#   _SERVICE          sjks-frontend-staging | sjks-frontend-prod
#   _MIN_INSTANCES    0 on staging (saves money), 1 on production (no cold start for visitors)
#   _SUPABASE_URL, _SUPABASE_KEY   the Supabase project and its PUBLISHABLE key (public by design, never the secret key)
#   _SITE_URL, _API_URL, _ADMIN_URL   public addresses of the website, the backend and the admin panel
substitutions:
  _SERVICE: sjks-frontend-staging
  _MIN_INSTANCES: "0"
  _REGION: asia-south1
  _REPO: sjks
  _SUPABASE_URL: ""
  _SUPABASE_KEY: ""
  _SITE_URL: https://stage.saharangosag.com
  _API_URL: https://stage-api.saharangosag.com
  _ADMIN_URL: https://stage-admin.saharangosag.com

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${BUILD_ID}
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_SUPABASE_KEY}
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg=NEXT_PUBLIC_ADMIN_URL=${_ADMIN_URL}
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${BUILD_ID}"]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${BUILD_ID}
      - --region=${_REGION}
      - --service-account=run-frontend@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --port=8080
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=5

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:${BUILD_ID}

# Required when the build runs as a user-specified service account: logs go to Cloud Logging.
options:
  logging: CLOUD_LOGGING_ONLY
