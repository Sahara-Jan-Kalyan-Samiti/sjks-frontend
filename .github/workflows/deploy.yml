name: Build and deploy (sjks-frontend)

on:
  pull_request:
  push:
    branches: [dev, stage, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

  # Builds the container with Cloud Build and deploys it to Cloud Run. Set in GitHub -> Settings -> Variables:
  #   GCP_PROJECT, GCP_REGION, GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT, NEXT_PUBLIC_SUPABASE_URL,
  #   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY, NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_API_URL, NEXT_PUBLIC_ADMIN_URL
  deploy:
    needs: check
    # dev = checks only; stage deploys to staging; main deploys to production.
    # Skipped until GCP is configured (GCP_WIF_PROVIDER is set in GitHub -> Settings -> Variables).
    if: github.event_name == 'push' && github.ref != 'refs/heads/dev' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and deploy
        run: |
          SERVICE=sjks-frontend-staging
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then SERVICE=sjks-frontend; fi
          gcloud builds submit --project "${{ vars.GCP_PROJECT }}" --config cloudbuild.yaml \
            --substitutions "_TAG=${GITHUB_SHA::7},_SERVICE=$SERVICE,_REGION=${{ vars.GCP_REGION }},_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }},_SUPABASE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }},_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }},_API_URL=${{ vars.NEXT_PUBLIC_API_URL }},_ADMIN_URL=${{ vars.NEXT_PUBLIC_ADMIN_URL }}" .
